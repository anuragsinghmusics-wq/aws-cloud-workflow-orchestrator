# Upstream ASGI Application Cluster
upstream fastapi_cluster {
    least_conn;
    server web:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost orchestrator.local;

    # Maximum client payload size (15MB for large migration batches)
    client_max_body_size 15M;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Limit maximum concurrent connections per IP
    limit_conn addr_conn_limit 50;

    # ------------------------------------------------------------------------
    # Frontend Static Single Page Application (React / Vite)
    # ------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (JS, CSS, images) with long TTL
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Client-Side Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------
    # Authentication Endpoints (Strict Rate Limiting)
    # ------------------------------------------------------------------------
    location /api/v1/auth/login {
        limit_req zone=auth_strict_limit burst=10 nodelay;

        proxy_pass http://fastapi_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # REST API Gateway
    # ------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://fastapi_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for batch operations
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering configuration
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
    }

    # ------------------------------------------------------------------------
    # WebSocket Real-Time Streaming Gateway
    # ------------------------------------------------------------------------
    location ~ ^/(?:api/v1/)?ws/ {
        proxy_pass http://fastapi_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Persistent connection timeouts (1 hour)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------------
    # Prometheus Metrics Scrape Proxy
    # ------------------------------------------------------------------------
    location /metrics {
        proxy_pass http://fastapi_cluster/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------------
    # Health Checks (No Rate Limiting for Orchestrator Probes)
    # ------------------------------------------------------------------------
    location /health/ {
        proxy_pass http://fastapi_cluster/api/v1/health/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------------
    # Interactive OpenAPI / Swagger Documentation
    # ------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://fastapi_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
