user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer & Request Size Limits (15MB accommodates large batch migration payloads)
    client_max_body_size 15M;
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Rate Limiting Zones (Defense against brute-force & denial of service)
    # 10MB zone tracks ~160,000 unique IP addresses
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Gzip Compression for JSON, JavaScript, CSS, and SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Structured JSON Log Format for Loki / Fluentbit / CloudWatch ingestion
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # Include modular server configuration files
    include /etc/nginx/conf.d/*.conf;
}
