version: "3.8"

networks:
  orchestrator-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  prometheus_data:
  grafana_data:

services:
  # ============================================================================
  # Nginx Reverse Proxy & SSL Gateway
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: orchestrator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../dashboard/dist:/usr/share/nginx/html:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - orchestrator-net

  # ============================================================================
  # FastAPI ASGI Core - Multi-Worker Gunicorn Cluster
  # ============================================================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchestrator-web
    restart: unless-stopped
    command: ["gunicorn", "-c", "gunicorn_conf.py", "src.main:app"]
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - WEB_CONCURRENCY=4
      - LOG_LEVEL=INFO
      - LOG_JSON_FORMAT=true
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=cloud-orchestrator-payload-staging
      - DYNAMODB_STATE_TABLE=Orchestrator_Workflow_Ledger
      - CLOUDWATCH_NAMESPACE=CloudWorkflowOrchestrator
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/orchestrator_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health/live\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - orchestrator-net

  # ============================================================================
  # Celery Distributed Migration Workers
  # ============================================================================
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchestrator-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "src.workers.celery_app.celery_app", "worker", "-l", "INFO", "-c", "4", "-Q", "critical,high,default,low,orchestrator_tasks"]
    environment:
      - ENVIRONMENT=production
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=cloud-orchestrator-payload-staging
      - DYNAMODB_STATE_TABLE=Orchestrator_Workflow_Ledger
      - CLOUDWATCH_NAMESPACE=CloudWorkflowOrchestrator
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/orchestrator_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - orchestrator-net

  # ============================================================================
  # Celery Beat - Periodic Scheduling & Zombie Task Reclamation
  # ============================================================================
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchestrator-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "src.workers.celery_app.celery_app", "beat", "-l", "INFO"]
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net

  # ============================================================================
  # Flower - Celery Operational Task Dashboard
  # ============================================================================
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchestrator-flower
    restart: unless-stopped
    command: ["celery", "-A", "src.workers.celery_app.celery_app", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net

  # ============================================================================
  # PostgreSQL 16 - Relational Metadata Store
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: orchestrator-postgres-prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=orchestrator_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-net

  # ============================================================================
  # Redis 7 - Broker with Append-Only Persistence
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-net

  # ============================================================================
  # LocalStack - Local AWS Cloud Emulator
  # ============================================================================
  localstack:
    image: localstack/localstack:3.8
    container_name: orchestrator-localstack-prod
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,cloudwatch,logs
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
    volumes:
      - ./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-net

  # ============================================================================
  # Prometheus - Time-Series Metrics Scraper
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: orchestrator-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - web
    networks:
      - orchestrator-net

  # ============================================================================
  # Grafana - Mission Control Visual Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: orchestrator-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=orchestrator_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - orchestrator-net
