global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

# Alerting rules (for future alertmanager integration)
rule_files: []

scrape_configs:
  - job_name: "orchestrator-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["web:8000"]
        labels:
          environment: "production"
          service: "workflow-orchestrator-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus-telemetry"
